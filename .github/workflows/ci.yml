name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · typecheck · verify WASM core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile WebAssembly simulation core
        run: npm run wasm

      - name: Typecheck
        run: npm run typecheck

      - name: Build web bundle
        run: npm run build

      - name: Verify simulation invariants (headless)
        run: npm run verify

      - name: Report artifact sizes
        run: |
          echo "### Bundle" >> $GITHUB_STEP_SUMMARY
          du -h dist/index.html dist/assets/* public/wasm/sim.wasm 2>/dev/null | sort -k2 >> $GITHUB_STEP_SUMMARY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
